# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: gaphor
  version: "3.4.0"
  python_min: "3.13"
  # segfaults if missing on e.g. a gtk3-based distro
  linux_extra: libgles
  osx_extra: pyobjc-framework-cocoa >=9.0.1
  # nothing yet
  win_extra: python *
  noarch_extra: |-
    ${{ linux_extra if noarch_platform == "linux" }}
    ${{ osx_extra if noarch_platform == "osx" }}
    ${{ win_extra if noarch_platform == "win" }}
  python_check_max: "3.15"

package:
  name: gaphor
  version: ${{ version }}

source:
  url: https://github.com/gaphor/gaphor/archive/refs/tags/${{ version }}.tar.gz
  sha256: b979668f321ca4228e468fa0ea5550af5881ba3675ff5fc36bbaa0720d46c769

build:
  number: 1
  noarch: python
  script:
    # compile the translation catalogues before packaging them in the wheel
    - ${{ PYTHON }} -c "from scripts.build_babel import compile_mo_release; compile_mo_release()"
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check
    # install the menuinst launcher and icon
    - if: linux
      then:
        - mkdir -p "$PREFIX/Menu"
        - cp "$RECIPE_DIR/menu/gaphor.json" "$PREFIX/Menu/gaphor.json"
        - cp "$SRC_DIR/data/logos/gaphor-256x256.png" "$PREFIX/Menu/gaphor.png"
    - if: osx
      then:
        - mkdir -p "$PREFIX/Menu"
        - cp "$RECIPE_DIR/menu/gaphor.json" "$PREFIX/Menu/gaphor.json"
        - cp "$SRC_DIR/_packaging/macos/gaphor.icns" "$PREFIX/Menu/gaphor.icns"
    - if: win
      then:
        - if not exist "%PREFIX%\Menu" mkdir "%PREFIX%\Menu"
        - copy /Y "%RECIPE_DIR%\menu\gaphor.json" "%PREFIX%\Menu\gaphor.json"
        - copy /Y "%SRC_DIR%\_packaging\windows\gaphor.ico" "%PREFIX%\Menu\gaphor.ico"
  python:
    entry_points:
      - gaphor = gaphor.main:main

requirements:
  host:
    - babel >=2.10.3
    - pip
    - poetry-core >=2.0.0,<3.0.0
    - python ${{ python_min }}.*
  run:
    - __${{ noarch_platform }}
    - ${{ noarch_extra | trim }}
    # from pyproject.toml
    - babel >=2.10.3
    - defusedxml >=0.7.1
    - dulwich >=1.2.21
    - gaphas >=5.1
    - jedi >=0.18.1,<0.20.0
    - pillow >=13.0.0
    - pycairo >=1.29.2
    - pydot >=1.4.2
    - pygobject >=3.58.1
    - python >=${{ python_min }}
    - python-generic >=1.1.8
    - tinycss2 >=1.0.2
    # not on PyPI
    - adwaita-icon-theme
    - gtk4
    - gtksourceview
    - libadwaita

tests:
  - python:
      imports: gaphor
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - files:
      recipe:
        - run_test.py
    requirements:
      run:
        - psutil
        - pytest
        - python ${{ python_min }}.*
    script:
      env:
        # for anything on windows
        PYTHONIOENCODING: utf-8
      content:
        - if: win
          then:
            - md c:\temp\conda-forge-gaphor-test
            - copy run_test.py c:\temp\conda-forge-gaphor-test
            - cd c:\temp\conda-forge-gaphor-test
        - python run_test.py
        - if: win
          then:
            # workaround for rattler-build failing to clean up the
            # test folder if any processes are still running; this
            # "waits a long", as the most reliable `sleep` equivalent
            - ping -n 31 127.0.0.1 >nul 2>&1

about:
  summary: Gaphor is the simple modeling tool written in Python.
  license: Apache-2.0
  license_file:
    - LICENSES/Apache-2.0.txt
    - LICENSES/BSD-3-Clause.txt
    - LICENSES/GPL-2.0-or-later.txt
    - LICENSES/LGPL-2.1-or-later.txt
  homepage: https://gaphor.org
  repository: https://github.com/gaphor/gaphor
  documentation: https://docs.gaphor.org

extra:
  recipe-maintainers:
    - danyeaw
